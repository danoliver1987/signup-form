<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign-up form</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>

    <div class="full-container">

    <div class="left-side">
      <img
        src="images/choc.jpg"
        alt="Signage repeating the word 'Chocolate' three times"
      />
      <!-- Photo credit : Alexander Kaufmann on Unsplash -->
    
    </div>

    <div class="right-side">

    <h3>This is just a dummy page! We all deserve some cholatey indulgence now and 
        then! With (company name) you will receive the finest chocolate from around 
        the world. Sign up now to receive 50% off your first order.
    </h3>
    <h3>You know you want to.</h3>

    <form method="post">

        <p class="letsdo">Let's do this!</p>

        <div class="form-container">

        <p>
        <label for="first_name">First Name:</label>
        <input type="text" 
        id="first_name" 
        name="first_name" 
        placeholder="Joe">

        <label for="user_email">Email Address:</label>
        <input type="email" 
        id="user_email" 
        name="email" 
        placeholder="you@example.com">

        <label for="user_password">Password:</label>
        <input type="password" 
        id="user_password" 
        name="password"
        placeholder="Minimum 6 characters">

        <label for="last_name">Last Name:</label>
        <input type="text" 
        id="last_name" 
        name="last_name" 
        placeholder="Bloggs">
        
        <label for="phonenumber">Phone Number:</label>
        <input type="number" id="phonenumber" name="phone-number">
        
        <label for="confirm_password">Password:</label>
        <input type="password" 
        id="confirm_password" 
        name="confirm-password"
        placeholder="Minimum 6 characters">
        </p>

        </div>

    </form>

    <button>Create account</button>

    <h4>Already have an account? <a href="https://www.mozilla.org/en-US/">Log in</a></h4>

    </div>

    </div>

    </div>

  </body>
</html>
